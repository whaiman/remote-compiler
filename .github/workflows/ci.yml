name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check rgcc/ tests/

      - name: black --check
        run: black --check rgcc/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    # Advisory only for now: the codebase carries pre-existing mypy debt
    # (missing return annotations, a few redundant casts). This surfaces
    # it on every PR without blocking merges until it's paid down.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy rgcc/

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Cross-platform sanity: the client is pure-python and must import
          # cleanly on the OS most Termux/desktop users actually run it from.
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build-check:
    name: Build sanity check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Check for GCC/Clang/MinGW availability assumptions
        # The server entrypoint (rgccd) assumes real compilers are on PATH;
        # the client entrypoint (rgcc) must NOT require them. This guards
        # against accidentally coupling client startup to compiler presence.
        run: |
          pip install dist/*.whl
          python -c "import rgcc.client.cli"
